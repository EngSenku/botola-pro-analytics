name: botola_bi
version: "1.0.0"
profile: botola_bi
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  botola_bi:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging"]

    intermediate:
      +materialized: view
      +schema: intermediate
      +tags: ["intermediate"]

    marts:
      fcts:
        +materialized: table
        +schema: marts
        +tags: ["marts", "fact"]
      dims:
        +materialized: table
        +schema: marts
        +tags: ["marts", "dimension"]