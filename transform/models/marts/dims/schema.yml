version: 2

models:

  - name: dim_teams
    description: >
      One row per team per valid period (SCD Type 2).
      Tracks team metadata over time — name, stadium, city, badge.
      is_current = true flags the active record for each team.
      valid_from / valid_to define the period each record was accurate.
    columns:
      - name: team_id
        description: Unique team identifier from API-Football
        tests:
          - not_null

      - name: team_name
        description: Official team name
        tests:
          - not_null

      - name: founded_year
        description: Year the club was founded
        tests:
          - dbt_utils.accepted_range:
              min_value: 1900
              max_value: 2025

      - name: valid_from
        description: Date from which this version of the team record is valid
        tests:
          - not_null

      - name: valid_to
        description: Date until which this record is valid (9999-12-31 = current)
        tests:
          - not_null

      - name: is_current
        description: True if this is the active/current record for this team
        tests:
          - not_null

      - name: source
        description: Data source for this team record
        tests:
          - not_null
          - accepted_values:
              values: ["api_football", "thesportsdb"]

  - name: dim_players
    description: >
      One row per player per valid period (SCD Type 2).
      Handles player transfers — when a player moves clubs, a new record is inserted
      with a new valid_from and is_current = true, and the old record gets valid_to = transfer date.
      Answers Q12 (transfer impact on stats).
    columns:
      - name: player_id
        description: Unique player identifier from API-Football
        tests:
          - not_null

      - name: player_name
        description: Player full name
        tests:
          - not_null

      - name: nationality
        description: Player nationality
        tests:
          - not_null

      - name: is_current
        description: True if this is the active record for this player
        tests:
          - not_null

      - name: valid_from
        description: Start date for this player-team record
        tests:
          - not_null

      - name: valid_to
        description: End date for this player-team record
        tests:
          - not_null

  - name: dim_seasons
    description: >
      One row per Botola Pro season.
      Reference dimension used by all fact tables that span multiple seasons.
      is_current = true flags the active season.
    columns:
      - name: season_id
        description: Unique season identifier e.g. 2024
        tests:
          - unique
          - not_null

      - name: season_label
        description: Human-readable season label e.g. 2024-2025
        tests:
          - unique
          - not_null

      - name: start_year
        description: Calendar year the season started

      - name: end_year
        description: Calendar year the season ended

      - name: is_current
        description: True for the currently active season
        tests:
          - not_null

  - name: dim_dates
    description: >
      Date dimension covering all match dates in the warehouse.
      One row per calendar date. Enables time-based filtering and grouping
      in Metabase without writing date functions in every query.
    columns:
      - name: date_key
        description: Date in YYYYMMDD format used as surrogate key
        tests:
          - unique
          - not_null

      - name: year
        description: Calendar year
        tests:
          - not_null

      - name: month
        description: Month number 1-12
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              max_value: 12

      - name: day_of_week
        description: Day number 0-7
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 2, 3, 4, 5, 6, 7]